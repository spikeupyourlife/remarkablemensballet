title: Album
icon: album

options:
  changeSlug: true

columns:
  - width: 2/3
    sections:
      basics:
        type: fields
        fields:
          headline:
            label: Album title
            type: text
            help: "e.g. \"2024 Christmas Show\", \"Rehearsals — Apr 2025\""
          description:
            label: Description
            type: textarea
            size: medium
            help: What was happening here?

      photos:
        type: files
        label: Photos
        template: image
        layout: cards
        image:
          query: file.crop(400, 400)
        info: "{{ file.taken_at.toDate('d M Y') }}"
        sortBy: taken_at asc

  - width: 1/3
    sections:
      meta:
        type: fields
        fields:
          showDate:
            label: Date of event
            type: date
            display: YYYY-MM-DD
            help: "Or earliest date — for sorting in the gallery."
          location:
            label: Location
            type: text
            default: Queenstown
          featured:
            label: Featured album?
            type: toggle
          cover:
            label: Cover image
            type: files
            template: image
            query: page.files.template('image')
            max: 1
            help: Leave empty to use the first photo.
          showInList:
            label: Show on Gallery page?
            type: toggle
            default: true

      stats:
        type: stats
        reports:
          - label: Photos
            value: "{{ page.files.template('image').count }}"
            theme: positive
          - label: People tagged
            value: "{{ page.files.template('image').pluck('performers', ',').count }}"
