title: Performances
preset: pages
icon: calendar

options:
  changeSlug: false
  changeTemplate: false
  delete: false

sections:
  intro:
    type: fields
    fields:
      headline:
        label: Headline
        type: text
        default: Upcoming nonsense
      blurb:
        label: Blurb
        type: textarea
        size: small
      pastShows:
        label: Past shows (archive list)
        type: structure
        fields:
          year: { type: text, width: 1/4 }
          show: { type: text, width: 3/4 }
          note: { type: text }

  performances:
    headline: Performances
    type: pages
    template: performance
    layout: cards
    image:
      query: page.poster.toFile
      cover: true
    info: "{{ page.venue }} · {{ page.showDate.toDate('d M Y') }}"

  videos:
    headline: Videos (formerly the Videos page)
    type: pages
    template: video
    create: video
    layout: cards
    image:
      query: page.thumbnail.toFile
      cover: true
    info: "{{ page.showYear }}"

  add:
    headline: Add a performance
    type: pages
    template: performance
    create: performance
    layout: list
    limit: 0
