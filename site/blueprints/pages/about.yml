title: Our story
preset: page
icon: info

options:
  changeSlug: false
  changeTemplate: false

columns:
  - width: 2/3
    sections:
      story:
        type: fields
        fields:
          headline:
            label: Headline
            type: text
            default: How this happened
          body:
            label: The story
            type: textarea
            size: large
          milestones:
            label: Milestone strip
            type: structure
            fields:
              year: { type: text, width: 1/4 }
              title: { type: text, width: 3/4 }
              text: { type: textarea, buttons: false }
          stats:
            label: Stats board
            type: structure
            fields:
              number: { type: text, width: 1/3 }
              label: { type: text, width: 2/3 }
          shame:
            label: Wall of Shame
            type: structure
            fields:
              year: { type: text, width: 1/4 }
              title: { type: text, width: 3/4 }
              text: { type: textarea, buttons: false }

  - width: 1/3
    sections:
      hero:
        type: files
        label: Hero image
        template: image
        max: 1
        layout: cards
