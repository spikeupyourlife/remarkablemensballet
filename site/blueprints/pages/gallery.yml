title: Gallery
preset: pages
icon: image

options:
  changeSlug: false
  changeTemplate: false
  delete: false

sections:
  intro:
    type: fields
    fields:
      headline:
        label: Headline
        type: text
        default: Twenty years of evidence
      blurb:
        label: Blurb
        type: textarea
        size: small
        default: Photos from rehearsals, dressing rooms, backstage chaos, and (occasionally) the actual stage.

  albums:
    headline: Albums
    type: pages
    template: album
    layout: cards
    image:
      query: page.cover.toFile ?? page.files.template('image').first
      cover: true
    info: "{{ page.showDate.toDate('d M Y') }} · {{ page.files.template('image').count }} photos"
    sortBy: showDate desc

  photos:
    headline: Standalone photos
    type: pages
    template: photo
    layout: cards
    image:
      query: page.images.first
      cover: true
    info: "{{ page.showName }} · {{ page.showDate.toDate('Y') }}"

  add:
    headline: Add to gallery
    type: pages
    templates:
      - album
      - photo
    create:
      - album
      - photo
    layout: list
    limit: 0
