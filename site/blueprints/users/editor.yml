title: Editor
description: Can add and edit content, but can't change site settings or users.
home: "{{ site.panel.url }}"

permissions:
  access:
    panel: true
    site: true
    users: false
  files:
    changeName: true
    create: true
    delete: true
    read: true
    replace: true
    update: true
  pages:
    create: true
    delete: true
    duplicate: true
    move: true
    read: true
    sort: true
    update: true
  site:
    update: false
  user:
    changeEmail: true
    changeLanguage: true
    changeName: true
    changePassword: true
    changeRole: false
    delete: false
    update: true
  users: false

columns:
  - width: 1/3
    sections:
      role:
        type: info
        headline: Editor role
        text: |
          You can **add and edit content** — pages, photos, videos, press articles, performer profiles.

          What you can't do (admins handle these):

          - Change site-wide settings
          - Manage users or roles
  - width: 2/3
    sections:
      profile:
        type: fields
        fields:
          notes:
            label: Personal notes
            type: textarea
            size: medium
